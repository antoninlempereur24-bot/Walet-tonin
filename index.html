<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tonin HÔTEL - Accès Chambre</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #080808;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Cinzel', 'Times New Roman', serif;
      overflow: hidden;
    }

    /* Conteneur de la carte */
    .card-container {
      perspective: 1000px;
    }

    .card {
      width: 320px;
      height: 520px;
      background: linear-gradient(145deg, #151515, #080808);
      border-radius: 20px;
      border: 1px solid rgba(212, 175, 55, 0.3);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 15px rgba(212, 175, 55, 0.1);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 40px 20px;
      cursor: pointer;
      position: relative;
      transition: transform 0.2s ease, box-shadow 0.3s ease;
    }

    .card:active {
      transform: scale(0.98);
    }

    /* Style Texte Doré Metallic */
    .gold-text {
      background: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
    }

    /* Monogramme Logo T */
    .logo-circle {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 1px solid rgba(212, 175, 55, 0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      margin-bottom: 10px;
    }

    .logo-t {
      font-size: 65px;
      font-weight: 300;
      line-height: 1;
    }

    /* Marque */
    .brand-name {
      font-size: 42px;
      font-weight: 400;
      letter-spacing: 2px;
      margin-top: -10px;
    }

    .brand-subtitle {
      font-size: 14px;
      letter-spacing: 6px;
      opacity: 0.8;
      margin-top: 5px;
    }

    /* Indicateur de statut LED & Texte */
    .status-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 2;
    }

    .led {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background-color: #d4af37;
      box-shadow: 0 0 10px #d4af37;
      transition: background-color 0.3s ease, box-shadow 0.3s ease;
    }

    .status-text {
      font-size: 12px;
      letter-spacing: 2px;
      color: #888;
      text-transform: uppercase;
      transition: color 0.3s ease;
      text-align: center;
    }

    /* Pied de carte */
    .footer {
      text-align: center;
    }

    .footer p {
      font-size: 11px;
      letter-spacing: 4px;
      color: #c5a059;
    }

    .footer-line {
      width: 30px;
      height: 1px;
      background: #c5a059;
      margin: 6px auto;
      opacity: 0.5;
    }

    /* Visual feedback états (Accepté / Refusé / Processing) */
    .card.processing .led {
      background-color: #e67e22;
      box-shadow: 0 0 15px #e67e22;
      animation: blink 0.5s infinite alternate;
    }

    .card.accepted {
      border-color: #2ecc71;
      box-shadow: 0 0 25px rgba(46, 204, 113, 0.4);
    }
    .card.accepted .led {
      background-color: #2ecc71;
      box-shadow: 0 0 20px #2ecc71;
    }
    .card.accepted .status-text {
      color: #2ecc71;
      font-weight: bold;
    }

    .card.refused {
      border-color: #e74c3c;
      box-shadow: 0 0 25px rgba(231, 76, 60, 0.4);
      animation: shake 0.4s ease-in-out;
    }
    .card.refused .led {
      background-color: #e74c3c;
      box-shadow: 0 0 20px #e74c3c;
    }
    .card.refused .status-text {
      color: #e74c3c;
      font-weight: bold;
    }

    @keyframes blink {
      from { opacity: 0.3; }
      to { opacity: 1; }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
  </style>
</head>
<body>

  <div class="card-container">
    <div class="card" id="hotelCard">
      
      <div style="display: flex; flex-direction: column; align-items: center;">
        <div class="logo-circle">
          <span class="logo-t gold-text">T</span>
        </div>
        <div class="brand-name gold-text">tonin</div>
        <div class="brand-subtitle gold-text">— HÔTEL —</div>
      </div>

      <div class="status-box">
        <div class="led" id="led"></div>
        <div class="status-text" id="statusText">APPUYER POUR OUVRIR</div>
      </div>

      <div class="footer">
        <p>BIENVENUE</p>
        <div class="footer-line"></div>
        <p>WELCOME</p>
      </div>

    </div>
  </div>

  <script>
    const card = document.getElementById('hotelCard');
    const statusText = document.getElementById('statusText');
    let isProcessing = false;

    card.addEventListener('click', () => {
      if (isProcessing) return;
      isProcessing = true;

      // État de chargement (Analyse)
      card.className = 'card processing';
      statusText.innerText = "VÉRIFICATION...";

      // Simulation du délai de lecture du badge
      setTimeout(() => {
        // Résultat aléatoire : 70% de chance d'être accepté
        const isSuccess = Math.random() > 0.3;

        if (isSuccess) {
          card.className = 'card accepted';
          statusText.innerText = "ACCÈS AUTORISÉ";
          if (navigator.vibrate) navigator.vibrate([100, 50, 100]); // Vibration sur mobile
        } else {
          card.className = 'card refused';
          statusText.innerText = "ACCÈS REFUSÉ";
          if (navigator.vibrate) navigator.vibrate(300); // Vibration sur mobile
        }

        // Réinitialisation automatique après 3 secondes
        setTimeout(() => {
          card.className = 'card';
          statusText.innerText = "APPUYER POUR OUVRIR";
          isProcessing = false;
        }, 3000);

      }, 1000);
    });
  </script>
</body>
</html>
